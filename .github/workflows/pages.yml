name: Deploy Pstock to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Taiwan market closes at 13:30. Scheduled jobs may run late.
    # 14:10 initial run; 15:35 retries if official TWSE feed was delayed.
    - cron: "10 6 * * 1-5"
    - cron: "35 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# A review PR must never cancel or pre-empt an in-progress production
# market-data refresh or GitHub Pages deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pstock-review-{0}', github.event.pull_request.number) || 'pstock-production-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax and stock-scanner logic
        run: |
          python -m py_compile scripts/run_screener.py scripts/history_integrity.py scripts/trade_quality.py scripts/update_prices.py scripts/update_history.py
          python scripts/history_integrity.py
          python scripts/trade_quality.py
          python scripts/run_screener.py --self-test
          python -c 'import re,pathlib; [pathlib.Path("/tmp/"+p.stem+".js").write_text(re.findall(r"<script[^>]*>(.*?)</script>",p.read_text(encoding="utf-8"),re.S)[-1],encoding="utf-8") for p in [pathlib.Path("index.html"),pathlib.Path("screener.html")]]'
          node --check /tmp/index.js
          node --check /tmp/screener.js
      - name: Smoke-test live market screener (PR only)
        if: github.event_name == 'pull_request'
        env:
          SCREENER_HISTORY_PATH: ${{ runner.temp }}/screener-pr-smoke.json.gz
          SCREENER_BOOTSTRAP_LIMIT: "20"
        run: |
          python scripts/run_screener.py
          python -c 'import json; x=json.load(open("data/screener.json")); print("Universe",x["universe"],"Historic",x["history_ready"],"Calendar",x["calendar_sources"],"Refreshed",x["history_refresh"],"Missing",len(x["history_gaps"]),"Classic",x["classic_total"],"Pool",len(x["candidates"])); assert x["universe"]>1000 and len(x["calendar_sources"])>0 and "classic_candidates" in x; assert all("quality_state" in r and "entry_type" in r and "stop_source" in r for r in x["candidates"]+x["classic_candidates"])'
  build:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Taiwan closing prices
        if: ${{ !contains(github.event.head_commit.message, '[skip-market-fetch]') }}
        run: python scripts/update_prices.py

      - name: Fetch historical OHLCV for trendline analysis
        if: ${{ !contains(github.event.head_commit.message, '[skip-market-fetch]') }}
        run: python scripts/update_history.py

      - name: Restore historical screener cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pstock-screener-history.json.gz
          key: pstock-market-history-v1-${{ github.run_id }}
          restore-keys: |
            pstock-market-history-v1-

      - name: Build daily A/B/C stock screener
        env:
          SCREENER_HISTORY_PATH: ${{ runner.temp }}/pstock-screener-history.json.gz
          SCREENER_REFRESH_LIMIT: "800"
        run: python scripts/run_screener.py

      - name: Save updated screener history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pstock-screener-history.json.gz
          key: pstock-market-history-v1-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  # Run deployment in a NEW job, only after upload has fully finished.
  # Same-job deployments intermittently see zero artifacts just after upload.
  # See GitHub's recommended dedicated Pages deployment-job layout.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub's artifact metadata may temporarily lag behind a successful
      # upload. Retry ONLY deployment, never re-upload a second artifact.
      - name: Delay before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 25

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail if both deployment attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deployment failed twice; uploaded artifact was not published."
          exit 1

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1423">
<meta name="description" content="實體會議室雙窗連續語音翻譯，日英語音轉繁體中文">
<title>會議譯字幕｜雙窗連續翻譯</title>
<style>
:root{color-scheme:dark;--bg:#0d1423;--edge:#34425b;--card:#171f31;--text:#f5f8ff;--sub:#b2c2d8;--mint:#89eedc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--text);background:var(--bg)}
button,select,input{font:inherit}
button{cursor:pointer;border:1px solid #596984;background:#293750;color:#f3f7ff;border-radius:12px;font-weight:700;min-height:40px;padding:9px 12px}
button:disabled{opacity:.45;cursor:not-allowed}button.primary{color:#0f2732;background:linear-gradient(110deg,#84e8d3,#9cbffe);border:0}button.stop{background:#663b4c;border-color:#9c6075}
#app{height:100vh;height:100dvh;min-height:400px;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:12px 14px 9px;background:#121c30;border-bottom:1px solid #35415a}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center}
.name{font-size:18px;font-weight:850;letter-spacing:.01em}.subname{font-size:11px;color:var(--sub);margin-top:2px}
.topRight{display:flex;align-items:center;gap:7px}.pill{border-radius:12px;border:1px solid #475571;background:#243047;color:#d8e5f8;font-size:11px;padding:6px 8px}
.pill.live{background:#214b45;border-color:#428a7d;color:#affce6}.time{font-size:12px;color:#c7d4e8;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:7px;align-items:center;margin-top:10px}
.toolbar button{flex:1}.toolbar .smallbtn{flex:none;min-width:46px}
#message{margin-top:9px;color:#bac9dc;font-size:11px;line-height:1.4;max-height:33px;overflow:auto}
#message.err{color:#ffc8bb}
details{flex:none;border-bottom:1px solid #35415a;background:#182237;max-height:65dvh;overflow:auto}
summary{padding:10px 15px;cursor:pointer;color:#b9cadf;font-size:12px;user-select:none}
.settings{padding:0 14px 13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.field{display:block;font-size:12px;color:#c3d3e9}
.field select,.field input{display:block;width:100%;margin-top:6px;padding:10px;color:#fff;background:#0e192b;border:1px solid #56647d;border-radius:10px;min-height:40px;outline:none}
#customFields{margin-top:9px}.tip{font-size:11px;color:#becbd9;line-height:1.55;margin:10px 0}
.agree{display:flex;gap:9px;margin-top:8px;padding:9px 10px;border-radius:9px;background:#3a2c31;color:#ffe2cd;font-size:11px;line-height:1.5}
.agree input{margin-top:2px;width:17px;height:17px;accent-color:#88dfd0;flex:none}
.workspace{display:grid;grid-template-rows:1fr 1fr;gap:10px;flex:1;min-height:0;padding:10px 10px max(10px,env(safe-area-inset-bottom));overflow:hidden}
.panel{display:flex;flex-direction:column;min-height:0;border:1px solid #3b5068;background:#17253a;border-radius:17px;overflow:hidden}
.panel.chinese{background:linear-gradient(130deg,#132f38,#1a283e 80%);border-color:#43827d}
.panelhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex:none;padding:11px 13px;border-bottom:1px solid #34505c;min-height:44px}
.panelhead strong{font-size:13px}.hint{font-size:10px;color:#9caec8}
.scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding:13px 14px 20px;scrollbar-width:thin}
.translated{font-size:clamp(25px,6.6vw,38px);font-weight:720;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;letter-spacing:.014em}
.translated.large{font-size:clamp(32px,9vw,54px)}.source{font-size:clamp(19px,5.6vw,30px);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.blank{color:#839aad;font-weight:400}.preview{color:#acd9d1;opacity:.75;font-style:italic}.srcPreview{color:#d8c999;opacity:.9}
#translationBusy{color:#bde8da;font-size:11px}
footer{display:none}
@media(min-width:800px){#app{max-width:1024px;margin:0 auto;border-left:1px solid #314157;border-right:1px solid #314157}.workspace{gap:12px;padding:12px}.scroll{padding:18px 20px}header{padding:14px 18px}}
@media(max-width:360px){.name{font-size:15px}.subname{font-size:10px}.toolbar button{font-size:12px;padding:8px 6px}.time{font-size:11px}.twocol{grid-template-columns:1fr}.workspace{gap:7px;padding:7px}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="top"><div><div class="name">會議譯字幕 <span style="font-size:11px;color:#87e0d5">連續模式</span></div><div class="subname">上：繁體中文　／　下：原文</div></div>
<div class="topRight"><span class="time" id="clock">00:00:00</span><span class="pill" id="status">待命</span></div></div>
<div class="toolbar"><button id="startBtn" class="primary">🎙 開始翻譯</button><button id="stopBtn" class="stop" disabled>■ 結束</button><button id="sizeBtn" class="smallbtn" title="切換中文字體大小">字 A+</button></div>
<div id="message" role="status" aria-live="polite">選好語言並同意資料風險後開始，手機放桌上，畫面保持開啟。</div>
</header>
<details id="settings" open>
<summary>⚙ 會議語言與翻譯設定（開始後自動收合）</summary>
<div class="settings">
<div class="twocol">
<label class="field">現場發言語言<select id="language"><option value="ja-JP">🇯🇵 日文</option><option value="en-US">🇺🇸 英文（國際）</option><option value="en-GB">🇬🇧 英文（英式）</option><option value="de-DE">🇩🇪 德文</option><option value="fr-FR">🇫🇷 法文</option></select></label>
<label class="field">翻譯來源<select id="mode"><option value="cloud">線上試用翻譯</option><option value="own">公司自有翻譯伺服器</option><option value="none">僅顯示原文（測試）</option></select></label>
</div>
<div id="customFields" hidden>
<label class="field">LibreTranslate HTTPS 端點<input id="endpoint" type="url" autocomplete="off" placeholder="https://example.com/translate"></label>
<label class="field" style="margin-top:8px">API 金鑰（不會儲存）<input id="apiKey" type="text" autocomplete="off" placeholder="若有需要才填寫"></label>
</div>
<p class="tip" id="modeInfo">線上試用採用 MyMemory 免費服務，翻譯文字會送到外部伺服器。免費額度有限，長時間會議可能用完或被限速，無法保證整場持續有中文翻譯。</p>
<label class="agree"><input type="checkbox" id="consent"><span>我了解資料傳送風險。Android Chrome 的網頁語音辨識可能將音訊送至瀏覽器服務商，線上試用翻譯會再傳送文字。這不是離線保密工具，不用於機密或未經授權的會議。</span></label>
</div>
</details>
<main class="workspace">
<section class="panel chinese" aria-label="繁體中文連續翻譯">
<div class="panelhead"><strong>繁體中文</strong><div class="hint" id="translationBusy">尚未開始</div></div>
<div class="scroll" id="zhScroll"><div id="zhText" class="translated blank">翻譯會持續出現在這裡…</div><div id="zhPreview" class="translated preview"></div></div>
</section>
<section class="panel" aria-label="日文或英文連續原文">
<div class="panelhead"><strong id="sourceLabel">日文原文</strong><div class="hint" id="micStatus">麥克風尚未啟動</div></div>
<div class="scroll" id="srcScroll"><div id="srcText" class="source blank">發言內容會在這裡持續出現…</div><div id="srcPreview" class="source srcPreview"></div></div>
</section>
</main>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const SpeechEngine=window.SpeechRecognition||window.webkitSpeechRecognition;
const codes={"ja-JP":"ja","en-US":"en","en-GB":"en","de-DE":"de","fr-FR":"fr"};
let running=false, recog=null, generation=0, connecting=false, listening=false, restartTimeout=null, reconnectionCount=0, ticker=null, startedAt=0, wakeLock=null;
let queue=[], queueBusy=false, currentSource="", partialSource="", partialTimer=null, lastPreviewTime=0, lastPreviewSource="", previewVersion=0, partialFailures=0, translatedCount=0;
let fontLarge=false;
const MAX_PREVIEW_REQUEST_BYTES=410;
const utf8size=s=>new TextEncoder().encode(s).length;
function clock(){
const sec=Math.max(0,Math.floor((Date.now()-startedAt)/1000));
$("clock").textContent=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(x=>String(x).padStart(2,"0")).join(":");
}
function state(text,ok){$("status").textContent=text;$("status").classList.toggle("live",!!ok)}
function msg(text,error){$("message").textContent=text;$("message").classList.toggle("err",!!error)}
function scrollToBottom(id){const el=$(id);el.scrollTop=el.scrollHeight}
function paintSource(text,partial){
if(text){if($("srcText").classList.contains("blank")){$("srcText").textContent="";$("srcText").classList.remove("blank")}
$("srcText").append(document.createTextNode(($("srcText").textContent?"\n":"")+text))}
$("srcPreview").textContent=partial||"";
scrollToBottom("srcScroll")
}
function paintChinese(text){
if(!text)return;
const node=$("zhText");
if(node.classList.contains("blank")){node.textContent="";node.classList.remove("blank")}
node.append(document.createTextNode((node.textContent?"\n":"")+text));
translatedCount++;scrollToBottom("zhScroll");
}
function setPreview(zh,version){if(version!==previewVersion||!running)return;$("zhPreview").textContent=zh||"";scrollToBottom("zhScroll")}
function resetView(){
$("zhText").textContent="翻譯會持續出現在這裡…";$("zhText").classList.add("blank");
$("srcText").textContent="發言內容會在這裡持續出現…";$("srcText").classList.add("blank");
$("srcPreview").textContent="";$("zhPreview").textContent="";
currentSource="";partialSource="";lastPreviewSource="";translatedCount=0;previewVersion++;queue=[];queueBusy=false;partialFailures=0;
$("translationBusy").textContent="等待發言";
}
function updateLanguageLabel(){const label=$("language").selectedOptions[0].textContent;$("sourceLabel").textContent=label+"原文"}
function syncControls(){
$("startBtn").disabled=running;$("stopBtn").disabled=!running;$("language").disabled=running;$("mode").disabled=running;$("endpoint").disabled=running;$("apiKey").disabled=running;
$("micStatus").textContent=listening?"收音中":running?"重新連接中":"麥克風已關閉";
}
function splitForProvider(raw){
const out=[];let current="";
for(const c of raw){const next=current+c;if(utf8size(next)>MAX_PREVIEW_REQUEST_BYTES&&current){out.push(current);current=c}else current=next}
if(current)out.push(current);return out;
}
async function translate(text,mode,from){
if(mode==="none")return "";
let chunks=splitForProvider(text),results=[];
for(const part of chunks){
const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
try{
let response;
if(mode==="cloud"){
const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(part)+"&langpair="+encodeURIComponent(from+"|zh-TW");
response=await fetch(url,{signal:ctrl.signal,cache:"no-store"});
if(!response.ok)throw new Error("HTTP "+response.status);
const data=await response.json();
if(Number(data.responseStatus)!==200||!data.responseData||!data.responseData.translatedText||data.quotaFinished)throw new Error(data.responseDetails||"免費額度不足／翻譯服務失敗");
const raw=String(data.responseData.translatedText);
const area=document.createElement("textarea");area.innerHTML=raw;results.push(area.value);
}else{
const endpoint=$("endpoint").value.trim();
if(!/^https:\/\//i.test(endpoint))throw new Error("翻譯端點必須是 HTTPS");
const params={q:part,source:from,target:"zh",format:"text"};
const key=$("apiKey").value.trim();if(key)params.api_key=key;
response=await fetch(endpoint,{method:"POST",mode:"cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(params),signal:ctrl.signal});
if(!response.ok)throw new Error("HTTP "+response.status);
const data=await response.json();
if(!data.translatedText)throw new Error("翻譯端點沒有回傳文字");
results.push(String(data.translatedText));
}
}finally{clearTimeout(timer)}
}
return results.join(" ");
}
function enqueue(text,run){
queue.push({text,run,mode:$("mode").value,from:codes[$("language").value]});processQueue();
}
async function processQueue(){
if(queueBusy)return;
queueBusy=true;
while(queue.length){
const job=queue.shift();
if(job.run!==generation)continue;
$("translationBusy").textContent="翻譯中…";
try{
const t=await translate(job.text,job.mode,job.from);
if(job.run===generation){if(job.mode==="none"){$("translationBusy").textContent="只顯示原文"}else{paintChinese(t);$("translationBusy").textContent="翻譯持續中"}}
}catch(e){
if(job.run===generation){$("translationBusy").textContent="翻譯服務異常";msg("翻譯服務暫時無法使用："+(e.name==="AbortError"?"連線逾時":String(e.message||e))+"。原文仍會持續顯示。",true)}
}
}
queueBusy=false;
}
function clearInterim(){partialSource="";$("srcPreview").textContent="";$("zhPreview").textContent="";previewVersion++;clearTimeout(partialTimer);partialTimer=null}
function previewCandidate(text,run){
if($("mode").value==="none")return;
const now=Date.now();
if(utf8size(text)<24||now-lastPreviewTime<6500||text===lastPreviewSource||partialFailures>=3)return;
lastPreviewTime=now;lastPreviewSource=text;
const pv=++previewVersion,from=codes[$("language").value],mode=$("mode").value;
clearTimeout(partialTimer);
partialTimer=setTimeout(async ()=>{
try{
if(!running||run!==generation||pv!==previewVersion)return;
const shortened=splitForProvider(text)[0];
const output=await translate(shortened,mode,from);
if(run===generation){partialFailures=0;setPreview(output,pv)}
}catch(_){partialFailures++}
},400);
}
function finalText(text,run){
if(run!==generation||!running||!text)return;
clearInterim();
paintSource(text,"");
enqueue(text,run);
}
function captureResults(event,run,seen){
if(!running||run!==generation)return;
let partial="";
for(let i=event.resultIndex;i<event.results.length;i++){
const res=event.results[i],str=(res[0]&&res[0].transcript||"").trim();
if(!str)continue;
if(res.isFinal){if(!seen.has(i)){seen.add(i);finalText(str,run)}}
else partial+=(partial?" ":"")+str;
}
partialSource=partial;
$("srcPreview").textContent=partial;
scrollToBottom("srcScroll");
if(partial)previewCandidate(partial,run);
else{$("zhPreview").textContent="";previewVersion++}
}
function disconnect(reason,hard){
listening=false;connecting=false;syncControls();
if(!running)return;
if(hard){
finish();
msg("麥克風無法使用："+reason+"。請檢查 Chrome 權限及語言支援後重試。",true);return;
}
state("重連中",false);msg(reason+"。正在嘗試恢復收音，短暫中斷可能漏字。",true);
scheduleRestart();
}
function scheduleRestart(){
if(!running||restartTimeout)return;
const wait=Math.min(7000,500*Math.pow(1.6,Math.min(reconnectionCount,6)));
restartTimeout=setTimeout(()=>{restartTimeout=null;openRecognition()},wait);
}
function openRecognition(){
if(!running||connecting||listening)return;
if(!SpeechEngine){finish();msg("瀏覽器沒有語音辨識功能。請使用 Android Chrome。",true);return}
const run=generation;
const r=new SpeechEngine(),seen=new Set();recog=r;connecting=true;
r.lang=$("language").value;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
r.onstart=()=>{if(!running||run!==generation){try{r.stop()}catch(_){}return}listening=true;connecting=false;reconnectionCount=0;state("持續聆聽",true);syncControls();msg("持續顯示中。請保持螢幕亮起及 Chrome 在前景，語音辨識可能短暫重連。",false)};
r.onresult=event=>captureResults(event,run,seen);
r.onerror=event=>{
if(!running||run!==generation)return;
const code=event.error||"unknown";
if(["not-allowed","service-not-allowed","audio-capture","language-not-supported"].includes(code)){disconnect(code,true)}
else if(code!=="no-speech"&&code!=="aborted"){reconnectionCount++;msg("辨識連線異常："+code+"；正在嘗試重新連線。",true)}
};
r.onend=()=>{
if(!running||run!==generation||r!==recog)return;
listening=false;connecting=false;clearInterim();syncControls();
reconnectionCount++;state("重連中",false);
if(reconnectionCount>12){finish();msg("語音服務已連續多次中斷，必須重新按開始。網頁無法保證無間斷收音。",true);return}
scheduleRestart();
};
try{r.start()}catch(e){connecting=false;reconnectionCount++;if(reconnectionCount>12){finish();msg("無法重新啟動語音辨識："+String(e.message||e),true)}else scheduleRestart()}
}
async function requestWake(){try{if(document.visibilityState==="visible"&&"wakeLock" in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(_){}}
function releaseWake(){const w=wakeLock;wakeLock=null;if(w)w.release().catch(()=>{})}
function finish(){
if(!running)return;
running=false;generation++;listening=false;connecting=false;
clearTimeout(restartTimeout);restartTimeout=null;clearInterval(ticker);ticker=null;clearInterim();
const r=recog;recog=null;if(r)try{r.stop()}catch(_){}
releaseWake();syncControls();state("已結束",false);$("translationBusy").textContent=queueBusy?"最後一段翻譯處理中":"已結束";
$("settings").open=false;
}
function start(){
if(running)return;
if(!SpeechEngine){msg("Chrome 不支援 Web Speech Recognition，無法開始語音轉文字。",true);return}
if(!window.isSecureContext){msg("需要 HTTPS 才能啟動麥克風。",true);return}
if(!$("consent").checked){msg("請先勾選設定內的資料風險同意，再開始翻譯。",true);$("settings").open=true;return}
if($("mode").value==="own"&&!/^https:\/\//i.test($("endpoint").value.trim())){msg("請填寫 HTTPS 自有翻譯伺服器網址。",true);$("settings").open=true;return}
generation++;running=true;listening=false;connecting=false;reconnectionCount=0;startedAt=Date.now();clock();clearInterval(ticker);ticker=setInterval(clock,1000);resetView();updateLanguageLabel();syncControls();state("啟動中",false);$("settings").open=false;
openRecognition();requestWake();
}
$("startBtn").addEventListener("click",start);
$("stopBtn").addEventListener("click",()=>{finish();msg("會議已結束。沒有儲存對話紀錄；重新開始會清空目前畫面。",false)});
$("sizeBtn").addEventListener("click",()=>{fontLarge=!fontLarge;$("zhText").classList.toggle("large",fontLarge);$("zhPreview").classList.toggle("large",fontLarge);$("sizeBtn").textContent=fontLarge?"字 A−":"字 A+"});
$("language").addEventListener("change",updateLanguageLabel);
$("mode").addEventListener("change",()=>{
const mode=$("mode").value;$("customFields").hidden=mode!=="own";
$("modeInfo").textContent=mode==="cloud"?"線上試用採用 MyMemory 免費服務，翻譯文字會送到外部伺服器。免費額度有限，長時間會議可能用完或被限速，無法保證整場持續有中文翻譯。":mode==="own"?"只會把辨識文字送到你填寫的伺服器，但 Chrome 語音辨識本身仍可能使用外部服務。":"只顯示原文，暫不送到翻譯服務；Chrome 語音辨識本身仍可能使用外部服務。";
});
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"){if(running){requestWake();if(!listening&&!connecting)scheduleRestart()}}
else if(running)msg("注意：畫面切到背景可能導致麥克風辨識中斷；請保持 Chrome 顯示。",true);
});
window.addEventListener("beforeunload",()=>{if(recog)try{recog.abort()}catch(_){}});
updateLanguageLabel();syncControls();
if(!SpeechEngine)msg("這個瀏覽器不支援網頁語音辨識；請從 Chrome 瀏覽器開啟。",true);
})();
</script>
</body>
</html>

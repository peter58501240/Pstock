<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="會議室手機收音、日文英文轉繁體中文，即時雙視窗連續字幕">
<title>會議譯字幕｜長時間連續翻譯</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--surface:#111b2d;--border:#293a54;--text:#edf5ff;--muted:#a1b2c8;--aqua:#6fe4c7}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer;background:#233249;color:#e8f4ff;border:1px solid #455770;border-radius:12px;font-weight:700;padding:9px 12px;min-height:42px}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:#79e4d0;color:#0d2931;border-color:#79e4d0}
button.danger{background:#593445;border-color:#b36d7d}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:420px;max-width:1050px;margin:auto;overflow:hidden}
header{flex:none;background:#121b2b;border-bottom:1px solid var(--border);padding:10px 13px}
.headrow{display:flex;justify-content:space-between;gap:9px;align-items:center}
.brand{font-size:16px;font-weight:850}
.subtitle{font-size:10px;color:var(--muted);margin-top:2px}
.state{display:flex;align-items:center;gap:8px;font-size:11px;color:#c0d1e8}
#state{border:1px solid #536276;background:#273448;color:#d3e2f2;border-radius:30px;padding:5px 8px;white-space:nowrap}
#state.active{background:#164c41;border-color:#4a9d89;color:#a9ffeb}
#state.warn{border-color:#bf8a43;color:#fcdba5}
#clock{font-variant-numeric:tabular-nums}
.controls{display:flex;gap:7px;margin-top:9px;align-items:center}
.controls button{flex:1;min-width:0;font-size:13px;white-space:nowrap}
.controls button.small{flex:0 0 auto;padding:8px;font-size:12px}
.languages{display:flex;gap:3px;margin-top:9px}
.languages button{flex:1;border:1px solid var(--border);background:#19273a;color:#adbfda;min-height:36px;font-size:12px}
.languages button.selected{background:#244d69;border-color:#6bbad7;color:#fff}
.notice{color:#afc2d3;font-size:11px;line-height:1.45;margin-top:8px;max-height:35px;overflow-y:auto}
.notice.error{color:#ffb5b0}
.settings{flex:none;background:#172136;border-bottom:1px solid var(--border);max-height:47dvh;overflow-y:auto}
.settings>summary{cursor:pointer;padding:8px 14px;color:#bfd2e4;font-size:11px}
.settingsbox{padding:0 13px 13px}
.settingsrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label.field{display:block;color:#c2d1e4;font-size:11px}
.field select,.field input{display:block;width:100%;margin-top:5px;padding:10px 9px;border-radius:9px;background:#0f192c;border:1px solid #506078;color:#fff;min-height:40px;outline:none}
.help{font-size:11px;line-height:1.55;color:#b5c6d9;margin:8px 0}
.consent{display:flex;align-items:flex-start;gap:8px;background:#372b33;border:1px solid #6f5360;padding:10px;border-radius:11px;font-size:11px;line-height:1.55;color:#ffe7dc;margin-top:8px}
.consent input{flex:none;accent-color:#72ddca;width:18px;height:18px}
.panels{min-height:0;flex:1;display:grid;grid-template-rows:minmax(0,2.15fr) minmax(0,1fr);gap:7px;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#172336;border:1px solid #33445b;border-radius:14px}
.panel.chinese{background:linear-gradient(132deg,#15343b 0%,#182739 85%);border-color:#2e736f}
.panelhead{flex:none;border-bottom:1px solid #344457;display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:7px 11px;font-size:12px}
.panelhead .title{font-size:13px;font-weight:800}
.panelhead .minor{color:#a3bacd;font-size:10px;max-width:60%;text-align:right}
.stream{overflow:auto;min-height:0;flex:1;padding:10px 12px 17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;overscroll-behavior:contain}
#zhFinal,#srcFinal{white-space:pre-wrap;overflow-wrap:anywhere}
#zhStream{font-size:clamp(24px,7vw,38px);font-weight:700;line-height:1.57}
#srcStream{font-size:clamp(16px,5.3vw,27px);font-weight:500}
#app.large #zhStream{font-size:clamp(31px,9vw,53px)}
#app.large #srcStream{font-size:clamp(18px,5.8vw,32px)}
.draft{color:#b5eadf;font-weight:400}
#srcDraft{color:#e5ce93}
.placeholder{color:#8497ad;font-weight:400}
.busy{color:#7fdac8}
@media(min-width:700px){.panels{gap:10px;padding:12px}.stream{padding:16px 22px}.brand{font-size:19px}.controls button{font-size:14px}}
@media(max-width:370px){.brand{font-size:14px}.subtitle{font-size:9px}.controls button{padding:8px 6px;font-size:11px}.languages button{font-size:11px}.settingsrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="headrow">
<div><div class="brand">會議譯字幕 <span style="color:#74dcca;font-size:11px">V5 · 連續模式</span></div><div class="subtitle">手機收音｜上方繁體中文、下方日英原文</div></div>
<div class="state"><span id="clock">00:00:00</span><span id="state">待命</span></div>
</div>
<div class="controls"><button id="startBtn" class="primary">🎙 開始收音</button><button id="stopBtn" class="danger" disabled>■ 結束</button><button id="sizeBtn" class="small" aria-label="切換字體大小">字 A+</button><button id="clearBtn" class="small">清空</button></div>
<div class="languages"><button type="button" id="jaBtn" class="selected" aria-pressed="true">🇯🇵 日文</button><button type="button" id="enBtn" aria-pressed="false">🇬🇧 英文</button></div>
<div class="notice" id="message" role="status">首次使用請展開設定、閱讀資料風險並勾選同意，然後按「開始收音」。</div>
</header>
<details id="settings" class="settings" open>
<summary>⚙ 翻譯與資料安全設定（可收合）</summary>
<div class="settingsbox">
<div class="settingsrow">
<label class="field">翻譯模式<select id="translationMode"><option value="cloud">網路試用翻譯（MyMemory）</option><option value="original">只辨識原文（不翻譯）</option><option value="own">自有翻譯伺服器</option></select></label>
<label class="field">發言中暫定翻譯<select id="previewMode"><option value="off">關閉（省額度、更穩定）</option><option value="on">開啟（較即時、較耗額度）</option></select></label>
</div>
<div id="ownPanel" hidden>
<label class="field" style="margin-top:9px">自有 LibreTranslate HTTPS 端點<input id="ownUrl" type="url" autocomplete="off" placeholder="https://translate.example.com/translate"></label>
<label class="field" style="margin-top:8px">API 金鑰（僅保留於本頁記憶體）<input id="ownKey" type="password" autocomplete="off"></label>
</div>
<p class="help" id="modeHelp">試用版把辨識後的文字傳送到 MyMemory；有免費額度限制，長時間會議可能無法持續翻譯。沒有額外保存紀錄。</p>
<label class="consent"><input id="consent" type="checkbox"><span>我了解：Chrome 的語音辨識可能將音訊交給瀏覽器服務商；網路翻譯會把文字交給外部服務。本網頁不是離線或已通過公司資安核准的工具，不應用於機密或未經授權的會議。</span></label>
</div>
</details>
<main class="panels">
<section class="panel chinese"><div class="panelhead"><span class="title">🇹🇼 繁體中文即時翻譯</span><span class="minor" id="translationState">待命</span></div>
<div class="stream" id="zhStream"><span id="zhFinal" class="placeholder">翻譯會持續出現在這裡…</span><span id="zhDraft" class="draft"></span></div></section>
<section class="panel"><div class="panelhead"><span class="title" id="sourceTitle">🇯🇵 日文原文</span><span class="minor" id="recognitionState">麥克風未啟動</span></div>
<div class="stream" id="srcStream"><span id="srcFinal" class="placeholder">說話時會先出現暫定原文…</span><span id="srcDraft" class="draft"></span></div></section>
</main>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
const MAX_CHARS=9000;
const MAX_TRANSLATE_CHARS=450;
let language="ja-JP", active=false, recognizer=null, epoch=0, engine=0, state="idle", pendingTimer=null, retryTimer=null, healthTimer=null, clockTimer=null, restartCount=0, lastSpeech=0, beginTime=0, lastError="", firstResult=false, wakeLock=null;
let finalSrc="", finalZh="", inProgress="", recognizedSlots=new Map(), pendingCarry=null, translations=[], translating=false, translatedWait=0, draftTimer=null, draftStamp=0, draftId=0, draftRequest=null;
let translationFailTime=0, translationErrorCount=0, fontBig=false, lastCommitedAt=0;
const toText=(v)=>String(v||"").trim();
const sourceCode=()=>language.startsWith("ja")?"ja":"en";
function setState(t,kind){$("state").textContent=t;$("state").className=kind||""}
function info(t,error){$("message").textContent=t;$("message").classList.toggle("error",!!error)}
function clock(){const dt=Math.max(0,Math.floor((Date.now()-beginTime)/1000));$("clock").textContent=[Math.floor(dt/3600),Math.floor(dt/60)%60,dt%60].map(x=>String(x).padStart(2,"0")).join(":")}
function scroll(id){const pane=$(id);if(pane.scrollHeight-pane.scrollTop-pane.clientHeight<180||!pane.dataset.manual)pane.scrollTop=pane.scrollHeight}
function watchScroll(id){const pane=$(id);let lastTop=0;pane.addEventListener("touchstart",()=>{lastTop=pane.scrollTop},{passive:true});pane.addEventListener("touchmove",()=>{if(pane.scrollTop<lastTop-20)pane.dataset.manual="yes"},{passive:true});pane.addEventListener("scroll",()=>{if(pane.scrollHeight-pane.scrollTop-pane.clientHeight<85)delete pane.dataset.manual},{passive:true})}
function trimLast(txt,max){return txt.length>max?"…"+txt.slice(-max):txt}
function render(){
$("srcFinal").textContent=finalSrc||"說話時會先出現暫定原文…";
$("srcFinal").classList.toggle("placeholder",!finalSrc);
$("srcDraft").textContent=inProgress?((finalSrc?" ":"")+inProgress):"";
$("zhFinal").textContent=finalZh||"翻譯會持續出現在這裡…";
$("zhFinal").classList.toggle("placeholder",!finalZh);
scroll("srcStream");scroll("zhStream");
}
function appendSource(text,uncertain){
const v=toText(text);if(!v)return;
const suffix=uncertain?"〔未完整確認〕":"";
finalSrc=trimLast(finalSrc+(finalSrc?"\n":"")+v+suffix,MAX_CHARS);lastCommitedAt=Date.now();render();
if($("translationMode").value!=="original"){translations.push({text:v,run:epoch,lang:sourceCode(),mode:$("translationMode").value,uncertain});scheduleTranslation()}
else{$("translationState").textContent="僅原文"}
}
function clearDraft(){
inProgress="";$("zhDraft").textContent="";draftId++;clearTimeout(draftTimer);draftTimer=null;render();
}
function normalize(txt){return toText(txt).replace(/[\s、。，．,.!?！？「」『』()（）]/g,"").toLocaleLowerCase()}
function overlapLeading(previous,next){
const a=toText(previous),b=toText(next);
if(!a||!b)return 0;
const max=Math.min(a.length,b.length);
for(let i=max;i>=12;i--){
if(normalize(a.slice(-i))===normalize(b.slice(0,i)))return i;
}
return 0;
}
function flushCarry(){
if(!pendingCarry)return;
const c=pendingCarry;pendingCarry=null;clearTimeout(pendingTimer);pendingTimer=null;
if(c.run===epoch&&c.text){appendSource(c.text,true);info("語音辨識曾短暫中斷，已保留最後的暫定原文（未完整確認）。",true)}
}
function holdInterim(text){
const v=toText(text);
if(!v||!active)return;
if(pendingCarry)flushCarry();
pendingCarry={text:v,run:epoch,at:Date.now()};
clearTimeout(pendingTimer);
pendingTimer=setTimeout(flushCarry,2300);
}
function onRecognizedFinal(raw,run){
if(run!==epoch||!active)return;
let text=toText(raw);if(!text)return;
if(pendingCarry){
const c=pendingCarry;pendingCarry=null;clearTimeout(pendingTimer);pendingTimer=null;
const ov=Date.now()-c.at<3500?overlapLeading(c.text,text):0;
if(ov){/* 新辨識已包含中斷前的暫定文字；以較可靠的定稿為準。 */}
else appendSource(c.text,true);
}
if(lastCommitedAt&&Date.now()-lastCommitedAt<1800){
const lines=finalSrc.split("\n"),previous=lines.at(-1)||"";
const ov=overlapLeading(previous,text);
if(ov&&text.length>ov)text=text.slice(ov).trim();
else if(ov&&text.length===ov)text="";
}
if(text)appendSource(text,false);
clearDraft();
}
function processResults(ev,run,serial){
if(!active||run!==epoch||serial!==engine)return;
lastSpeech=Date.now();firstResult=true;restartCount=0;
const results=ev.results;
let currentInterim="";
for(let i=0;i<results.length;i++){
const row=results[i],transcript=toText(row[0]&&row[0].transcript);
if(!transcript)continue;
if(row.isFinal){
if(recognizedSlots.get(i)!==transcript){recognizedSlots.set(i,transcript);onRecognizedFinal(transcript,run)}
}else currentInterim+=(currentInterim?" ":"")+transcript;
}
inProgress=currentInterim;
render();
if(currentInterim)scheduledDraft(currentInterim,run);
else{$("zhDraft").textContent="";draftId++;clearTimeout(draftTimer)}
}
function formatProblem(code){
const errors={
"no-speech":"暫時沒有辨識到聲音",
"network":"語音辨識網路暫時中斷",
"audio-capture":"無法存取麥克風",
"not-allowed":"麥克風權限未允許",
"service-not-allowed":"瀏覽器語音服務不可用",
"language-not-supported":"目前裝置不支援所選語言",
"aborted":"辨識已被中止"
};return errors[code]||("辨識錯誤："+code);
}
function scheduleRestart(reason){
if(!active||retryTimer)return;
state="waiting";$("recognitionState").textContent="收音重新連接中";
setState("重連中","warn");
restartCount++;
const delay=Math.min(5500,300*Math.pow(1.55,Math.min(restartCount,6)));
info(reason+"。正在嘗試重新收音，這段期間仍有漏字風險。",true);
retryTimer=setTimeout(()=>{retryTimer=null;bootRecognition()},delay);
}
function bootRecognition(){
if(!active||state==="starting"||state==="listening")return;
if(!SpeechAPI){endMeeting("此瀏覽器不支援語音辨識。");return}
const run=epoch,serial=++engine,rec=new SpeechAPI();
recognizer=rec;recognizedSlots=new Map();state="starting";
rec.lang=language;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
rec.onstart=()=>{
if(run!==epoch||!active||serial!==engine)return;
state="listening";$("recognitionState").textContent="收音中 · 字句即時更新";
setState("收音中","active");info("保持畫面開啟，若 Chrome 停止辨識，系統會自動嘗試重連。",false)
};
rec.onresult=e=>processResults(e,run,serial);
rec.onerror=e=>{
if(run!==epoch||!active||serial!==engine)return;
lastError=e.error||"未知";
if(["not-allowed","service-not-allowed","audio-capture","language-not-supported"].includes(lastError)){
endMeeting(formatProblem(lastError));
}else if(lastError!=="no-speech"&&lastError!=="aborted"){
info(formatProblem(lastError)+"。將嘗試自動恢復。",true)
}
};
rec.onend=()=>{
if(!active||run!==epoch||serial!==engine)return;
if(inProgress){holdInterim(inProgress);inProgress="";$("zhDraft").textContent="";draftId++;render()}
state="idle";scheduleRestart(lastError?formatProblem(lastError):"Chrome 結束本次辨識");
lastError="";
};
try{rec.start()}catch(e){state="idle";scheduleRestart("無法啟動辨識："+String(e.message||e))}
}
function health(){
if(!active)return;
if(state==="starting"&&Date.now()-lastSpeech>13000){
info("正在等待 Chrome 開啟麥克風；若一直沒有回應，請檢查權限。",true)
}
if(state==="idle"&&!retryTimer)scheduleRestart("語音辨識已停止");
}
async function acquireWake(){
try{if(document.visibilityState==="visible"&&navigator.wakeLock&&!wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
}
function releaseWake(){const ref=wakeLock;wakeLock=null;if(ref)ref.release().catch(()=>{})}
function endMeeting(reason){
if(!active)return;
active=false;epoch++;clearInterval(clockTimer);clearInterval(healthTimer);clearTimeout(retryTimer);retryTimer=null;clearTimeout(pendingTimer);pendingTimer=null;
if(pendingCarry){const c=pendingCarry;pendingCarry=null;if(c.text)appendEndCarry(c.text)}
if(inProgress)appendEndCarry(inProgress);
clearDraft();
const rec=recognizer;recognizer=null;state="idle";if(rec)try{rec.stop()}catch(e){}
releaseWake();$("startBtn").disabled=false;$("stopBtn").disabled=true;setState("已結束",reason?"warn":"");
$("jaBtn").disabled=false;$("enBtn").disabled=false;$("translationMode").disabled=false;$("previewMode").disabled=false;
$("recognitionState").textContent="收音已停止";$("translationState").textContent="已結束";
info(reason||"已結束收音；這次內容只保留在目前畫面，重新整理會消失。",!!reason)
}
function appendEndCarry(text){
const v=toText(text);if(!v)return;
finalSrc=trimLast(finalSrc+(finalSrc?"\n":"")+v+"〔未完整確認〕",MAX_CHARS);render();
}
function startMeeting(){
if(active)return;
if(!SpeechAPI){info("此瀏覽器不支援 Web Speech 語音辨識。請使用 Android Chrome。",true);return}
if(!window.isSecureContext){info("請從 HTTPS 網頁開啟，才能存取麥克風。",true);return}
if(!$("consent").checked){$("settings").open=true;info("開始前請先勾選資料傳送風險同意。",true);return}
if($("translationMode").value==="own"&&!/^https:\/\//i.test($("ownUrl").value.trim())){$("settings").open=true;info("請先填寫自有 HTTPS 翻譯端點。",true);return}
epoch++;active=true;state="idle";recognizer=null;engine=0;restartCount=0;firstResult=false;lastError="";lastSpeech=Date.now();lastCommitedAt=0;
finalSrc="";finalZh="";inProgress="";translations=[];translating=false;translatedWait=0;pendingCarry=null;translationErrorCount=0;translationFailTime=0;clearTimeout(retryTimer);retryTimer=null;clearTimeout(pendingTimer);
$("zhDraft").textContent="";$("srcDraft").textContent="";render();
$("startBtn").disabled=true;$("stopBtn").disabled=false;$("jaBtn").disabled=true;$("enBtn").disabled=true;$("translationMode").disabled=true;$("previewMode").disabled=true;
$("settings").open=false;
beginTime=Date.now();clock();clearInterval(clockTimer);clockTimer=setInterval(clock,1000);
clearInterval(healthTimer);healthTimer=setInterval(health,3500);
$("translationState").textContent=$("translationMode").value==="original"?"僅辨識原文":"等待翻譯";
bootRecognition();acquireWake();
}
function setLanguage(lang){
if(active){info("切換語言前請先結束收音，避免遺漏正在辨識的片段。",true);return}
language=lang;
$("jaBtn").classList.toggle("selected",lang==="ja-JP");$("enBtn").classList.toggle("selected",lang==="en-US");
$("jaBtn").setAttribute("aria-pressed",lang==="ja-JP"?"true":"false");$("enBtn").setAttribute("aria-pressed",lang==="en-US"?"true":"false");
$("sourceTitle").textContent=lang==="ja-JP"?"🇯🇵 日文原文":"🇬🇧 英文原文";
}
let batchTimer=null;
function scheduleTranslation(){if(batchTimer)return;batchTimer=setTimeout(()=>{batchTimer=null;processTranslations()},260)}
function takeBatch(){
const currentRun=epoch,limit=MAX_TRANSLATE_CHARS;
let text="",type="",mode="";
while(translations.length&&translations[0].run!==currentRun)translations.shift();
while(translations.length){
const next=translations[0];
if(!text){type=next.lang;mode=next.mode}
if(next.run!==currentRun||next.lang!==type||next.mode!==mode||text.length+next.text.length>limit&&text)break;
translations.shift();text+=(text?" ":"")+next.text;
if(text.length>=limit)break;
}
return{text,mode,lang:type,run:currentRun}
}
async function requestTranslate(input,from,mode){
if(mode==="original")return "";
let translated=[];
for(let p=0;p<input.length;p+=430){
const chunk=input.slice(p,p+430);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),11000);
try{
let response;
if(mode==="cloud"){
const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(chunk)+"&langpair="+encodeURIComponent(from+"|zh-TW");
response=await fetch(url,{signal:controller.signal,cache:"no-store"});
if(!response.ok)throw Error("HTTP "+response.status);
const payload=await response.json();
if(Number(payload.responseStatus)!==200||!payload.responseData?.translatedText||payload.quotaFinished)throw Error(String(payload.responseDetails||"免費翻譯額度不足"));
const txt=String(payload.responseData.translatedText),box=document.createElement("textarea");box.innerHTML=txt;translated.push(box.value);
}else{
const payload={q:chunk,source:from,target:"zh",format:"text"},apiKey=$("ownKey").value.trim();
if(apiKey)payload.api_key=apiKey;
response=await fetch($("ownUrl").value.trim(),{method:"POST",mode:"cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});
if(!response.ok)throw Error("HTTP "+response.status);
const data=await response.json();
if(!data.translatedText)throw Error("伺服器未傳回翻譯文字");
translated.push(String(data.translatedText));
}
}finally{clearTimeout(timer)}
}
return translated.join(" ");
}
async function processTranslations(){
if(translating)return;
translating=true;
let first=true;
while(translations.length){
const task=takeBatch();
if(!task.text)break;
if(task.run!==epoch)continue;
if(!first)await new Promise(r=>setTimeout(r,650));
first=false;
$("translationState").textContent=translations.length?"翻譯排隊中":"翻譯中";
try{
if(translationFailTime&&Date.now()-translationFailTime<4000)await new Promise(r=>setTimeout(r,1000));
const zh=await requestTranslate(task.text,task.lang,task.mode);
if(task.run===epoch){
finalZh=trimLast(finalZh+(finalZh?"\n":"")+zh,MAX_CHARS);$("zhDraft").textContent="";render();$("translationState").textContent="翻譯持續中";translationErrorCount=0;
}
}catch(e){
if(task.run===epoch){translationErrorCount++;translationFailTime=Date.now();
const reason=e.name==="AbortError"?"連線逾時":String(e.message||e);
$("translationState").textContent="翻譯服務異常";
info("原文仍會持續顯示，但翻譯失敗："+reason+"。免費服務可能限流。",true);
if(translationErrorCount>=4){translations.length=0;info("翻譯服務連續失敗，已停止請求以避免耗盡額度。原文仍可繼續辨識。請結束後更換翻譯來源。",true);break}
}}
}
translating=false;
}
function scheduledDraft(raw,run){
if($("previewMode").value!=="on"||$("translationMode").value==="original"||translations.length||translating||!active)return;
const v=toText(raw);
if(v.length<(language==="ja-JP"?14:28)||Date.now()-draftStamp<5000)return;
draftStamp=Date.now();const request=++draftId;
clearTimeout(draftTimer);
draftTimer=setTimeout(async()=>{
if(!active||run!==epoch||request!==draftId)return;
try{
const zh=await requestTranslate(v.slice(-190),sourceCode(),$("translationMode").value);
if(run===epoch&&request===draftId&&active&&inProgress===v){
$("zhDraft").textContent=(finalZh?" ":"")+zh;scroll("zhStream");
}
}catch(e){}
},160);
}
function clearView(){
finalSrc="";finalZh="";inProgress="";pendingCarry=null;clearTimeout(pendingTimer);pendingTimer=null;translations=[];
draftId++;$("zhDraft").textContent="";render();$("translationState").textContent=active?"已清空目前字幕":"待命";
}
$("startBtn").addEventListener("click",startMeeting);
$("stopBtn").addEventListener("click",()=>endMeeting(""));
$("jaBtn").addEventListener("click",()=>setLanguage("ja-JP"));
$("enBtn").addEventListener("click",()=>setLanguage("en-US"));
$("sizeBtn").addEventListener("click",()=>{fontBig=!fontBig;$("app").classList.toggle("large",fontBig);$("sizeBtn").textContent=fontBig?"字 A−":"字 A+"});
$("clearBtn").addEventListener("click",clearView);
$("translationMode").addEventListener("change",()=>{
$("ownPanel").hidden=$("translationMode").value!=="own";
$("modeHelp").textContent=$("translationMode").value==="cloud"?"使用 MyMemory 線上試用翻譯。免費額度可能無法支援長時間會議，並會將辨識文字傳給外部服務。":$("translationMode").value==="own"?"辨識文字送往你設定的自有伺服器；Chrome 語音辨識本身仍可能使用外部服務。":"不呼叫翻譯服務，只顯示辨識原文；Chrome 辨識仍可能使用外部服務。";
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&active)acquireWake();else if(active)info("網頁進入背景可能中斷收音，請保持 Chrome 畫面開啟。",true)});
window.addEventListener("beforeunload",()=>{active=false;try{recognizer?.abort()}catch(e){}});
watchScroll("srcStream");watchScroll("zhStream");setLanguage("ja-JP");render();
if(!SpeechAPI)info("此瀏覽器不支援網頁語音辨識；請使用 Android Chrome。",true);
})();
</script>
